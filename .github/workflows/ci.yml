name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: sqlite:///./ci.db
      SECRET_KEY: ci-secret-key
      SMTP_USERNAME: ci@example.com
      SMTP_PASSWORD: ci-password
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_URL: http://localhost:3000
      ADMIN_EMAILS: admin@test.com

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            portfolio-project/backend/requirements.txt
            portfolio-project/backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: portfolio-project
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Security audit (pip-audit)
        working-directory: portfolio-project
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Validate Alembic migrations
        working-directory: portfolio-project/backend
        run: python -m alembic upgrade head

      - name: Export OpenAPI schema
        working-directory: portfolio-project
        run: python backend/scripts/export_openapi.py --output backend/openapi.json

      - name: Check OpenAPI schema drift
        working-directory: portfolio-project
        run: git diff --exit-code -- backend/openapi.json

      - name: Run backend tests with coverage
        working-directory: portfolio-project
        run: python -m pytest -q

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: portfolio-project/backend/coverage.xml
          if-no-files-found: error

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portfolio-project/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: portfolio-project/frontend
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "npm ci failed on attempt $attempt. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Lint frontend
        working-directory: portfolio-project/frontend
        run: npm run lint

      - name: Enforce public server-component boundaries
        working-directory: portfolio-project/frontend
        run: npm run check:server-boundaries

      - name: Check generated API types
        working-directory: portfolio-project/frontend
        run: npm run check:api-types

      - name: Generate frontend coverage report
        working-directory: portfolio-project/frontend
        run: npm run test:coverage

      - name: Security audit (npm)
        working-directory: portfolio-project/frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: portfolio-project/frontend
        run: npm run build

      - name: Build bundle analysis
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref_name, 'feature/frontend-') || startsWith(github.ref_name, 'fix/frontend-') || startsWith(github.ref_name, 'refactor/frontend-')) }}
        working-directory: portfolio-project/frontend
        run: npm run analyze

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: portfolio-project/frontend/coverage/lcov.info
          if-no-files-found: error

      - name: Upload bundle analysis artifact
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref_name, 'feature/frontend-') || startsWith(github.ref_name, 'fix/frontend-') || startsWith(github.ref_name, 'refactor/frontend-')) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-bundle-analysis
          path: portfolio-project/frontend/.next/analyze
          if-no-files-found: warn

  sonarcloud:
    name: SonarCloud Scan (Push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend-quality
      - frontend-quality
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Detect SonarCloud configuration
        id: sonar_config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_ORGANIZATION" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping SonarCloud scan: SONAR_TOKEN or SONAR_ORGANIZATION is missing."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: ${{ steps.sonar_config.outputs.enabled == 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download backend coverage artifact
        if: ${{ steps.sonar_config.outputs.enabled == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-coverage
          path: portfolio-project/backend

      - name: Download frontend coverage artifact
        if: ${{ steps.sonar_config.outputs.enabled == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-coverage
          path: portfolio-project/frontend/coverage

      - name: SonarCloud scan
        if: ${{ steps.sonar_config.outputs.enabled == 'true' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          projectBaseDir: portfolio-project
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
