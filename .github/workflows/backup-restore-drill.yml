name: Backup Restore Drill

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: backup-restore-drill-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drill:
    name: PostgreSQL Backup + Restore Drill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_DB: portfolio_drill
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_drill"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run backup/restore drill
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: portfolio_drill
        run: |
          set -euo pipefail
          mkdir -p artifacts

          psql -v ON_ERROR_STOP=1 -f portfolio-project/database/migrations/01_portfolio_db_schema.sql

          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users (username, email, password_hash, is_active)
          VALUES ('drill-admin', 'drill@example.com', 'hashed-password', TRUE);
          SQL

          pg_dump --format=custom --file=artifacts/portfolio_drill.dump "$PGDATABASE"

          createdb portfolio_drill_restore
          pg_restore --no-owner --no-privileges --dbname=portfolio_drill_restore artifacts/portfolio_drill.dump

          ORIGINAL_USERS=$(psql -d portfolio_drill -t -A -c "SELECT COUNT(*) FROM users;")
          RESTORED_USERS=$(psql -d portfolio_drill_restore -t -A -c "SELECT COUNT(*) FROM users;")
          ORIGINAL_TABLES=$(psql -d portfolio_drill -t -A -c "SELECT string_agg(table_name, ',' ORDER BY table_name) FROM information_schema.tables WHERE table_schema = 'public';")
          RESTORED_TABLES=$(psql -d portfolio_drill_restore -t -A -c "SELECT string_agg(table_name, ',' ORDER BY table_name) FROM information_schema.tables WHERE table_schema = 'public';")

          echo "original_users=$ORIGINAL_USERS" | tee artifacts/drill-summary.txt
          echo "restored_users=$RESTORED_USERS" | tee -a artifacts/drill-summary.txt
          echo "original_tables=$ORIGINAL_TABLES" | tee -a artifacts/drill-summary.txt
          echo "restored_tables=$RESTORED_TABLES" | tee -a artifacts/drill-summary.txt

          if [ "$ORIGINAL_USERS" != "$RESTORED_USERS" ]; then
            echo "Restore validation failed: user counts mismatch" | tee -a artifacts/drill-summary.txt
            exit 1
          fi

          if [ "$ORIGINAL_TABLES" != "$RESTORED_TABLES" ]; then
            echo "Restore validation failed: table lists mismatch" | tee -a artifacts/drill-summary.txt
            exit 1
          fi

          echo "Backup/restore drill passed." | tee -a artifacts/drill-summary.txt

      - name: Upload drill artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backup-restore-drill
          path: artifacts
          if-no-files-found: error
          retention-days: 30
