name: Release Supply Chain

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package and attest
        required: true
        type: string

permissions: {}

concurrency:
  group: release-supply-chain-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  package-and-attest:
    name: Package, SBOM, and attest release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Create deterministic source artifact
        id: package
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          artifact="release-artifacts/Site-${RELEASE_TAG}.tar.gz"
          git archive --format=tar.gz --prefix="Site-${RELEASE_TAG}/" --output="$artifact" HEAD
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: release-artifacts/Site-${{ env.RELEASE_TAG }}.sbom.cdx.json
          artifact-name: Site-${{ env.RELEASE_TAG }}-sbom
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Upload release artifact and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Site-${{ env.RELEASE_TAG }}-supply-chain
          path: release-artifacts
          if-no-files-found: error
          retention-days: 90

      - name: Attest release artifact with its SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.package.outputs.artifact }}
          sbom-path: release-artifacts/Site-${{ env.RELEASE_TAG }}.sbom.cdx.json

      - name: Verify artifact attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "${{ steps.package.outputs.artifact }}" --repo "$GITHUB_REPOSITORY"
