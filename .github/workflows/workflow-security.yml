name: Workflow Security

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '13 4 * * 5'
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.4.0
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint workflow syntax
        run: actionlint -color

      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          # Required PR checks must not depend on SARIF upload/API availability.
          advanced-security: false
          persona: auditor
          min-severity: medium
          online-audits: false
          version: v1.21.0

  zizmor-online:
    name: Workflow Security Online Audit
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Audit workflows with online zizmor checks
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          advanced-security: true
          persona: auditor
          min-severity: medium
          online-audits: true
          version: v1.21.0
