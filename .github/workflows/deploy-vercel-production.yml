name: Deploy Frontend Production (Vercel)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-production:
    name: Vercel Production Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    defaults:
      run:
        working-directory: portfolio-project/frontend

    steps:
      - name: Check Vercel secrets
        id: vercel
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Vercel production deployment blocked::VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID must be configured in the production environment."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portfolio-project/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel production environment
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@56.3.1
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

          if [ ! -f .vercel/.env.production.local ]; then
            echo "::error title=Missing Vercel production environment::vercel pull did not create .vercel/.env.production.local."
            exit 1
          fi

          site_key_line=$(grep -E '^NEXT_PUBLIC_TURNSTILE_SITE_KEY=' .vercel/.env.production.local || true)
          site_key=${site_key_line#*=}
          if [ -z "${site_key//[[:space:]]/}" ]; then
            echo "::error title=Missing Turnstile site key::NEXT_PUBLIC_TURNSTILE_SITE_KEY must be set in Vercel Production before the frontend can deploy."
            exit 1
          fi

      - name: Build and deploy production frontend
        id: deploy
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ENV: production
        run: |
          vercel build --prod --token="$VERCEL_TOKEN"
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment URL: $DEPLOYMENT_URL"

      - name: Verify production contact bundle
        env:
          PRODUCTION_FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
        run: |
          python - <<'PY'
          import os
          import re
          import time
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          base_url = os.environ["PRODUCTION_FRONTEND_URL"].rstrip("/")
          if not base_url.startswith("https://"):
              raise SystemExit("PRODUCTION_FRONTEND_URL must start with https://")

          def fetch(url: str) -> bytes:
              request = Request(url, headers={"User-Agent": "Site-Vercel-Production-Deploy/1.0"})
              with urlopen(request, timeout=20) as response:
                  return response.read()

          for attempt in range(1, 13):
              try:
                  html = fetch(f"{base_url}/contact").decode("utf-8", errors="ignore")
                  script_urls = re.findall(r'<script[^>]+src="([^"]+)"', html)
                  bundle_text = ""
                  for script_url in dict.fromkeys(script_urls):
                      bundle_text += fetch(urljoin(f"{base_url}/contact", script_url)).decode(
                          "utf-8", errors="ignore"
                      )

                  if "challenges.cloudflare.com/turnstile" in bundle_text and "captcha_token" in bundle_text:
                      print("Production contact bundle contains Turnstile and captcha_token.")
                      break
                  print(f"Attempt {attempt}/12: production domain still serves an older contact bundle.")
              except Exception as error:
                  print(f"Attempt {attempt}/12: production bundle verification failed: {error}")

              if attempt < 12:
                  time.sleep(10)
          else:
              raise SystemExit("Production contact bundle did not become visible on PRODUCTION_FRONTEND_URL.")
          PY
