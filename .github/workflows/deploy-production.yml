name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Quality (Prod Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: sqlite:///./ci.db
      # Fall back to the same dummy test key ci.yml uses when CI_SECRET_KEY
      # is not configured; an empty key breaks every JWT-signing test.
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY || 'ci-secret-key' }}
      SMTP_USERNAME: ci@example.com
      SMTP_PASSWORD: ci-password
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_URL: http://localhost:3000
      ADMIN_EMAILS: admin@test.com

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            portfolio-project/backend/requirements.txt
            portfolio-project/backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: portfolio-project
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: portfolio-project
        run: python -m pytest -q

      - name: Validate Alembic migrations
        working-directory: portfolio-project/backend
        run: python -m alembic upgrade head

  frontend-quality:
    name: Frontend Quality (Prod Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portfolio-project/frontend/package-lock.json

      - name: Install dependencies
        working-directory: portfolio-project/frontend
        run: npm ci

      - name: Lint
        working-directory: portfolio-project/frontend
        run: npm run lint

      - name: Enforce public server-component boundaries
        working-directory: portfolio-project/frontend
        run: npm run check:server-boundaries

      - name: Test
        working-directory: portfolio-project/frontend
        run: npm run test

      - name: Build
        working-directory: portfolio-project/frontend
        run: npm run build

  # NOTE: there is no deploy-backend job on purpose. Railway has no inbound
  # deploy-hook URLs (its webhooks are outbound notifications only); the
  # backend deploys through Railway's own GitHub integration on every push to
  # main, and its start command runs `alembic upgrade head` before uvicorn.
  # This workflow's backend role is quality gate + post-deploy smoke checks.

  # NOTE: there is no deploy-frontend job on purpose either. The frontend
  # deploys through Vercel's own GitHub integration on every push to main,
  # which builds on Vercel with the project's production env (including
  # NEXT_PUBLIC_API_BASE_URL). A CI-side `vercel build` + `--prebuilt` deploy
  # raced that integration and once shipped a bundle with the localhost
  # fallback baked in, blanking every backend-driven section on the site.
  # This workflow's frontend role is quality gate + post-deploy smoke checks.

  frontend-smoke:
    name: Frontend Production Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - frontend-quality
    environment:
      name: production
    steps:
      - name: Validate frontend smoke configuration
        env:
          PRODUCTION_FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
        run: |
          if [ -z "$PRODUCTION_FRONTEND_URL" ]; then
            echo "Missing variable: PRODUCTION_FRONTEND_URL"
            exit 1
          fi
          if [[ ! "$PRODUCTION_FRONTEND_URL" =~ ^https:// ]]; then
            echo "PRODUCTION_FRONTEND_URL must start with https://"
            exit 1
          fi
          if [[ "$PRODUCTION_FRONTEND_URL" == */ ]]; then
            echo "PRODUCTION_FRONTEND_URL must not have a trailing slash"
            exit 1
          fi

      - name: Run frontend smoke checks
        env:
          PRODUCTION_FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
        run: |
          HOME_HTML=$(curl -fsSL "$PRODUCTION_FRONTEND_URL")
          echo "$HOME_HTML" | grep -q "https://yigitokur.me"
          echo "$HOME_HTML" | grep -q "Software Engineer - Cloud & DevOps"
          echo "$HOME_HTML" | grep -q "/opengraph-image"
          curl -fsSL "$PRODUCTION_FRONTEND_URL/about" >/dev/null
          curl -fsSL "$PRODUCTION_FRONTEND_URL/projects" >/dev/null
          curl -fsSL "$PRODUCTION_FRONTEND_URL/contact" >/dev/null
          curl -fsSL "$PRODUCTION_FRONTEND_URL/robots.txt" | grep -q "Sitemap: https://yigitokur.me/sitemap.xml"
          curl -fsSL "$PRODUCTION_FRONTEND_URL/sitemap.xml" | grep -q "https://yigitokur.me/projects"
          echo "Frontend smoke checks passed"

  backend-smoke:
    name: Backend Production Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend-quality
    environment:
      name: production
    steps:
      - name: Validate backend smoke configuration
        env:
          PRODUCTION_API_ROOT_URL: ${{ vars.PRODUCTION_API_ROOT_URL }}
          PRODUCTION_SMOKE_ADMIN_EMAIL: ${{ secrets.PRODUCTION_SMOKE_ADMIN_EMAIL }}
          PRODUCTION_SMOKE_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_ADMIN_PASSWORD }}
        run: |
          if [ -z "$PRODUCTION_API_ROOT_URL" ]; then
            echo "Missing variable: PRODUCTION_API_ROOT_URL"
            exit 1
          fi
          if [[ ! "$PRODUCTION_API_ROOT_URL" =~ ^https:// ]]; then
            echo "PRODUCTION_API_ROOT_URL must start with https://"
            exit 1
          fi
          if [[ "$PRODUCTION_API_ROOT_URL" == */ ]]; then
            echo "PRODUCTION_API_ROOT_URL must not have a trailing slash"
            exit 1
          fi
          if [ -z "$PRODUCTION_SMOKE_ADMIN_EMAIL" ] || [ -z "$PRODUCTION_SMOKE_ADMIN_PASSWORD" ]; then
            echo "Missing smoke admin credentials."
            exit 1
          fi

      - name: Wait for backend readiness
        env:
          PRODUCTION_API_ROOT_URL: ${{ vars.PRODUCTION_API_ROOT_URL }}
        run: |
          for attempt in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_API_ROOT_URL/ready")
            if [ "$code" = "200" ]; then
              echo "API is ready"
              exit 0
            fi
            echo "Attempt $attempt/30 ready=$code"
            sleep 10
          done
          echo "API readiness check failed"
          exit 1

      - name: Run backend smoke checks
        env:
          PRODUCTION_API_ROOT_URL: ${{ vars.PRODUCTION_API_ROOT_URL }}
          PRODUCTION_SMOKE_ADMIN_EMAIL: ${{ secrets.PRODUCTION_SMOKE_ADMIN_EMAIL }}
          PRODUCTION_SMOKE_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_ADMIN_PASSWORD }}
        run: |
          curl -fsSL "$PRODUCTION_API_ROOT_URL/live" >/dev/null
          curl -fsSL "$PRODUCTION_API_ROOT_URL/health" >/dev/null

          LOGIN_RESPONSE=$(curl -fsSL -X POST "$PRODUCTION_API_ROOT_URL/api/v1/auth/login/json" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$PRODUCTION_SMOKE_ADMIN_EMAIL\",\"password\":\"$PRODUCTION_SMOKE_ADMIN_PASSWORD\"}")

          ACCESS_TOKEN=$(printf '%s' "$LOGIN_RESPONSE" \
            | python -c "import json, sys; print(json.load(sys.stdin)['access_token'])")

          curl -fsSL "$PRODUCTION_API_ROOT_URL/api/v1/admin/stats" \
            -H "Authorization: Bearer $ACCESS_TOKEN" >/dev/null

          echo "Backend smoke checks passed"

      - name: Summarize backend smoke failure
        if: failure()
        env:
          PRODUCTION_ALERT_WEBHOOK_URL: ${{ secrets.PRODUCTION_ALERT_WEBHOOK_URL }}
        run: |
          echo "Backend smoke failed. Frontend deployment remained independent." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PRODUCTION_ALERT_WEBHOOK_URL" ]; then
            curl -fsSL -X POST "$PRODUCTION_ALERT_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{"text":"Backend production smoke failed while frontend deploy stayed independent."}' >/dev/null || true
          fi
