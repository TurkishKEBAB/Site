name: Deploy Backend Staging (Railway)

on:
  push:
    branches:
      - main
      - develop
      - "feature/backend-*"
      - "fix/backend-*"
      - "refactor/backend-*"
  workflow_dispatch:

concurrency:
  group: railway-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Railway Staging Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      # secrets context is not available in job-level `if`, so gate via a step output
      - name: Check staging deploy hook
        id: hook
        env:
          RAILWAY_DEPLOY_HOOK_URL: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RAILWAY_DEPLOY_HOOK_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_REF_NAME" = "develop" ]; then
            echo "RAILWAY_DEPLOY_HOOK_URL is required for $GITHUB_EVENT_NAME on $GITHUB_REF_NAME." >&2
            exit 1
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Staging deployment skipped"
              echo
              echo "RAILWAY_DEPLOY_HOOK_URL is not configured for this feature branch."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Trigger Railway staging deployment
        if: ${{ steps.hook.outputs.configured == 'true' }}
        env:
          RAILWAY_DEPLOY_HOOK_URL: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Railway staging deploy hook"
          curl -fsSL -X POST "$RAILWAY_DEPLOY_HOOK_URL"

      - name: Optional staging health check
        if: ${{ steps.hook.outputs.configured == 'true' && vars.STAGING_API_HEALTH_URL != '' }}
        env:
          STAGING_API_HEALTH_URL: ${{ vars.STAGING_API_HEALTH_URL }}
        run: |
          echo "Checking staging health: $STAGING_API_HEALTH_URL"
          for attempt in {1..20}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_API_HEALTH_URL")
            if [ "$code" = "200" ]; then
              echo "Staging health check passed"
              exit 0
            fi
            echo "Attempt $attempt/20 failed with status $code, retrying..."
            sleep 15
          done
          echo "Staging health check failed"
          exit 1

      - name: Record optional health-check skip
        if: ${{ steps.hook.outputs.configured == 'true' && vars.STAGING_API_HEALTH_URL == '' }}
        run: |
          {
            echo "### Staging health check skipped"
            echo
            echo "STAGING_API_HEALTH_URL is not configured; the deploy hook was triggered without a post-deploy health check."
          } >> "$GITHUB_STEP_SUMMARY"
