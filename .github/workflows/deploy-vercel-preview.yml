name: Deploy Frontend Preview (Vercel)

on:
  push:
    branches:
      - develop
      - "feature/frontend-*"
      - "fix/frontend-*"
      - "refactor/frontend-*"
  workflow_dispatch:

concurrency:
  group: vercel-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-preview:
    name: Vercel Preview Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    defaults:
      run:
        working-directory: portfolio-project/frontend

    steps:
      # secrets context is not available in job-level `if`, so gate via a step output
      - name: Check Vercel secrets
        id: vercel
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Vercel preview deployment skipped::VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID are not configured. The repository Vercel integration remains the preview provider."
          fi

      - name: Checkout
        if: ${{ steps.vercel.outputs.configured == 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node
        if: ${{ steps.vercel.outputs.configured == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portfolio-project/frontend/package-lock.json

      - name: Install dependencies
        if: ${{ steps.vercel.outputs.configured == 'true' }}
        run: npm ci

      - name: Build frontend
        if: ${{ steps.vercel.outputs.configured == 'true' }}
        run: npm run build

      - name: Deploy preview to Vercel
        id: deploy
        if: ${{ steps.vercel.outputs.configured == 'true' }}
        # Repo root: the Vercel project's Root Directory already points at
        # portfolio-project/frontend; running from the frontend dir makes the
        # CLI resolve a doubled, nonexistent path (`spawn sh ENOENT`).
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@56.3.1
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $DEPLOYMENT_URL"
