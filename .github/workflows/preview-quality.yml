name: Preview Quality

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      target_url:
        description: HTTPS Vercel preview URL to verify manually
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-quality-${{ github.event.deployment_status.id || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-preview:
    name: Validate Vercel preview
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.deployment_status.state == 'success' &&
          github.event.deployment_status.environment == 'Preview' &&
          github.event.deployment_status.creator.login == 'vercel[bot]'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview
    outputs:
      base_url: ${{ steps.validate.outputs.base_url }}
      ready: ${{ steps.validate.outputs.ready }}
    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      DEPLOYMENT_URL: >-
        ${{
          github.event_name == 'workflow_dispatch' && inputs.target_url ||
          github.event.deployment_status.environment_url ||
          github.event.deployment_status.target_url
        }}
    steps:
      - name: Validate Vercel preview URL
        id: validate
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          raw_url = os.environ.get("DEPLOYMENT_URL", "").strip()
          parsed = urlparse(raw_url)
          host = (parsed.hostname or "").lower()
          if parsed.scheme != "https" or parsed.username or parsed.password or not (
              host.endswith(".vercel.app") or host in {"yigitokur.me", "www.yigitokur.me"}
          ):
              raise SystemExit(f"Refusing to test non-Vercel HTTPS host: {raw_url!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"base_url=https://{parsed.netloc}\n")
              if os.environ.get("VERCEL_AUTOMATION_BYPASS_SECRET"):
                  output.write("ready=true\n")
              else:
                  output.write("ready=false\n")
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                      summary.write(
                          "### Preview Quality skipped\n\n"
                          "`VERCEL_AUTOMATION_BYPASS_SECRET` is not configured in the "
                          "`preview` Environment. Configure it to run Playwright and "
                          "Lighthouse against protected Vercel previews.\n"
                      )
          PY

  playwright:
    name: Playwright public smoke
    needs: validate-preview
    if: ${{ needs.validate-preview.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    env:
      PLAYWRIGHT_BASE_URL: ${{ needs.validate-preview.outputs.base_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portfolio-project/frontend/package-lock.json

      - name: Install dependencies
        working-directory: portfolio-project/frontend
        run: npm ci

      - name: Install Chromium
        working-directory: portfolio-project/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        working-directory: portfolio-project/frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            portfolio-project/frontend/playwright-report
            portfolio-project/frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    name: Lighthouse preview audit
    needs: validate-preview
    if: ${{ needs.validate-preview.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    continue-on-error: true
    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run Lighthouse CI audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: |
            ${{ needs.validate-preview.outputs.base_url }}/
            ${{ needs.validate-preview.outputs.base_url }}/about
            ${{ needs.validate-preview.outputs.base_url }}/projects
            ${{ needs.validate-preview.outputs.base_url }}/blog
            ${{ needs.validate-preview.outputs.base_url }}/contact
          configPath: portfolio-project/frontend/lighthouserc.cjs
          runs: 1
          temporaryPublicStorage: false

      - name: Upload Lighthouse reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
          retention-days: 14
