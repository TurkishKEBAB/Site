version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /portfolio-project/frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: chore(deps)
    groups:
      frontend-runtime:
        dependency-type: production
      frontend-tooling:
        dependency-type: development
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: /portfolio-project/backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 10
