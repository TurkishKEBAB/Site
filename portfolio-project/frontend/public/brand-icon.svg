<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Yigit Okur brand icon</title>
  <desc id="desc">Angular cyan and amber Y monogram on a dark technical grid.</desc>
  <defs>
    <linearGradient id="frame" x1="10" y1="8" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00d4ff" />
      <stop offset="0.55" stop-color="#0099cc" />
      <stop offset="1" stop-color="#f0b400" />
    </linearGradient>
    <linearGradient id="mark" x1="18" y1="14" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8fbff" />
      <stop offset="0.42" stop-color="#00d4ff" />
      <stop offset="1" stop-color="#00bce0" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="#06060e" />
  <path d="M8 18 18 8h28l10 10v28L46 56H18L8 46Z" fill="#0a0a14" stroke="url(#frame)" stroke-width="2.5" />
  <path d="M18 19h9l5 10 5-10h9L36 36v12h-8V36Z" fill="url(#mark)" filter="url(#glow)" />
  <path d="M43 15h7v7" fill="none" stroke="#f0b400" stroke-linecap="square" stroke-width="3" />
  <path d="M14 42v8h8" fill="none" stroke="#00d4ff" stroke-linecap="square" stroke-width="3" opacity="0.75" />
  <path d="M20 8h24M8 20v24M20 56h24M56 20v24" fill="none" stroke="#83e8ff" stroke-width="0.75" opacity="0.18" />
</svg>
