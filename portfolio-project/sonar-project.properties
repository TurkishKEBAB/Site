# Project identification
sonar.projectKey=TurkishKEBAB_Site
sonar.projectName=Site
sonar.projectVersion=1.0
sonar.python.version=3.13

# Source layout
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**/*.py,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/venv/**,**/.scannerwork/**,**/coverage/**,frontend/src/**/*.generated.ts
# Localization-only copy is validated by locale/content tests; Sonar treats JSX/string literals as executable lines.
sonar.coverage.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.generated.ts,frontend/src/content/**/*.ts,frontend/src/components/Footer.tsx,frontend/src/components/SystemTerminal.tsx,frontend/src/components/admin/AdminForms.tsx,frontend/src/components/admin/BlogForms.tsx,frontend/src/components/admin/TechnologyForms.tsx,frontend/src/components/nexus/CapabilityMatrix.tsx,frontend/src/components/nexus/CommandCenter.tsx,frontend/src/routes/Admin.tsx,frontend/src/routes/Blog.tsx,frontend/src/routes/BlogDetail.tsx,backend/tests/**/*.py,backend/app/models/**/*.py,backend/app/schemas/**/*.py,backend/app/config.py,backend/app/core/rate_limit.py,backend/app/services/__init__.py,backend/app/services/admin_audit.py,backend/app/services/cache_service.py,backend/app/services/captcha_service.py,backend/app/services/email_service.py,backend/app/services/github_service.py,backend/app/services/storage_service.py
# The bilingual form dictionary intentionally has parallel TR/EN shapes and should not count as duplicated logic.
sonar.cpd.exclusions=frontend/src/**/*.generated.ts,frontend/src/components/admin/AdminForms.tsx

# Coverage report imports
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Notes:
# - Pass server and auth at runtime (local SonarQube or SonarCloud)
#   Example local: sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=%SONAR_TOKEN%
#   Example cloud: sonar-scanner -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=<org> -Dsonar.token=%SONAR_TOKEN%
